<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>パン工房プクムク 純利益 公式LINEアニメーションスタンプ（全16種）プレビュー</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
    body {
      background: #7AC0D6; /* LINEトーク画面の定番水色 */
      color: #333;
      padding: 30px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      transition: background 0.3s;
    }
    header {
      background: #FFFFFF;
      padding: 24px 30px;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.12);
      text-align: center;
      max-width: 900px;
      width: 100%;
      margin-bottom: 24px;
    }
    h1 { font-size: 24px; color: #2E1505; margin-bottom: 8px; }
    p.desc { font-size: 14px; color: #555; line-height: 1.6; }
    .controls-wrap {
      margin-top: 16px;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 12px;
    }
    .btn-group {
      display: flex;
      gap: 6px;
      background: #F0F0F0;
      padding: 4px;
      border-radius: 24px;
    }
    .btn {
      padding: 6px 16px;
      border: none;
      border-radius: 20px;
      cursor: pointer;
      background: transparent;
      font-size: 13px;
      font-weight: bold;
      color: #555;
      transition: all 0.2s;
    }
    .btn.active {
      background: #06C755;
      color: #FFF;
      box-shadow: 0 2px 8px rgba(6,199,85,0.3);
    }
    .main-tab-wrap {
      display: flex;
      gap: 24px;
      justify-content: center;
      background: #FFF;
      padding: 20px;
      border-radius: 16px;
      max-width: 900px;
      width: 100%;
      box-shadow: 0 4px 16px rgba(0,0,0,0.1);
      margin-bottom: 24px;
    }
    .sub-item {
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(340px, 1fr));
      gap: 24px;
      max-width: 1160px;
      width: 100%;
    }
    .stamp-card {
      background: rgba(255, 255, 255, 0.96);
      border-radius: 16px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      box-shadow: 0 6px 20px rgba(0,0,0,0.08);
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .stamp-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 10px 28px rgba(0,0,0,0.15);
    }
    .img-wrap {
      width: 320px;
      height: 270px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }
    .img-wrap img {
      max-width: 100%;
      max-height: 100%;
      display: block;
    }
    .meta {
      margin-top: 12px;
      text-align: center;
      width: 100%;
    }
    .filename {
      font-weight: 900;
      font-size: 16px;
      color: #333;
    }
    .cam-tag {
      display: inline-block;
      margin-top: 4px;
      padding: 2px 10px;
      background: #E8F5E9;
      color: #2E7D32;
      font-size: 11px;
      font-weight: bold;
      border-radius: 8px;
    }
    .tag {
      display: inline-block;
      margin-top: 4px;
      padding: 2px 10px;
      background: #06C755;
      color: white;
      font-size: 11px;
      font-weight: bold;
      border-radius: 8px;
    }
  </style>
</head>
<body>
  <header>
    <h1>🥖 パン工房プクムク 純利益 公式LINEアニメーションスタンプ（全16種）</h1>
    <p class="desc">
      Blender（純くん.blend）のくり抜き顔・胸のロゴを完全同期し、16種類それぞれ専用のカメラワーク＆モーションを実装！<br>
      全コマ同一サイズ（320×270px）の正統APNG規格により、チカチカ・点滅を完全に根絶しています。
    </p>

    <div class="controls-wrap">
      <!-- 再生モード切替 -->
      <div class="btn-group">
        <button class="btn active" id="btn-loop" onclick="setMode('loop')">🔄 常時無限ループ再生</button>
        <button class="btn" id="btn-apng" onclick="setMode('apng')">📱 LINE公式APNG再生</button>
      </div>

      <!-- 背景切替 -->
      <div class="btn-group">
        <button class="btn active" onclick="setBg('#7AC0D6', event)">LINEトーク水色</button>
        <button class="btn" onclick="setBg('#FFFFFF', event)">白背景</button>
        <button class="btn" onclick="setBg('#1E1E1E', event)">ダークモード</button>
        <button class="btn" onclick="setBg('checker', event)">市松透過</button>
      </div>
    </div>
  </header>

  <div class="main-tab-wrap">
    <div class="sub-item">
      <span style="font-weight: bold; font-size: 13px; margin-bottom: 6px;">メイン画像 (main.png: 240×240)</span>
      <img id="img-main" src="main.png" alt="main" width="120" height="120" style="border: 1px solid #DDD; border-radius: 8px;">
    </div>
    <div class="sub-item">
      <span style="font-weight: bold; font-size: 13px; margin-bottom: 6px;">タブ画像 (tab.png: 96×74)</span>
      <img id="img-tab" src="tab.png" alt="tab" width="96" height="74" style="border: 1px solid #DDD; border-radius: 8px; margin-top: 23px;">
    </div>
  </div>

  <div class="container" id="stamp-container"></div>

  <script>
    const STAMPS = [
      { id: "01", title: "こんにちは！", cam: "バストアップ（表情＆手振り迫力）", desc: "右手を高く振って首かしげ＋太陽" },
      { id: "02", title: "ありがとう！", cam: "見下ろしハイアングル（お辞儀）", desc: "深々とお辞儀（ペコリ）＋ハート" },
      { id: "03", title: "OK！", cam: "右斜め前アップ（親指グッ）", desc: "首取れ解消！前に突き出した手と力強い頷き＋星" },
      { id: "04", title: "NO", cam: "顔ド迫力クローズアップ", desc: "枠切れ防止マージン確保！左右に激しく首振り＋汗" },
      { id: "05", title: "急ぎます！", cam: "斜め横サイドビュー（疾走感）", desc: "足抜け解消！靴が完全に連動して元気に疾走ダッシュ！" },
      { id: "06", title: "いただきます♪", cam: "見上げバストアップ（ワクワク）", desc: "胸の前で手を合わせて上下バウンド＋音符" },
      { id: "07", title: "お疲れさまです", cam: "癒やしのバストアップ", desc: "両手を差し伸べて首をコテンと傾げる＋湯気" },
      { id: "08", title: "やったー！", cam: "見上げローアングル（大ジャンプ）", desc: "画面下から大ジャンプして万歳＋紙吹雪" },
      { id: "09", title: "考え中...", cam: "斜めバストアップ（あごに手）", desc: "首をかしげて考え込むポーズ＋？マーク" },
      { id: "10", title: "プンプン！", cam: "正面バストアップ（腰に手）", desc: "腰に手を当てて足踏みぷんぷん＋怒りマーク" },
      { id: "11", title: "悲しい...", cam: "見下ろしハイアングル（しょんぼり）", desc: "肩を落としてガックリうなだれる＋涙しずく" },
      { id: "12", title: "イエーイ！", cam: "躍動感サイドステップ（ノリノリ）", desc: "両手を上げて左右にリズミカルにダンス＋音符" },
      { id: "13", title: "ポカ〜ン", cam: "正面ミディアムショット（呆然）", desc: "目を丸くして首を斜めに静止＋点々アニメ" },
      { id: "14", title: "いらっしゃいませ！", cam: "お出迎えフロントアングル", desc: "両手を広げて丁寧にお辞儀＋キラキラ" },
      { id: "15", title: "ブルブル...", cam: "ぎゅっと縮こまりアングル", desc: "寒さ・緊張で小刻みに震える＋寒気マーク" },
      { id: "16", title: "一発逆転！", cam: "力強いローアングル（ガッツポーズ）", desc: "拳を高く突き上げて気合注入＋闘志の炎" }
    ];

    let currentMode = 'loop'; // デフォルトは止まらない無限ループ再生！
    const baseTime = Date.now();

    function renderCards() {
      const container = document.getElementById('stamp-container');
      container.innerHTML = '';
      
      STAMPS.forEach((s) => {
        const ext = currentMode === 'loop' ? 'gif' : 'png';
        const src = `${s.id}.${ext}?v=${baseTime}`;
        
        const card = document.createElement('div');
        card.className = 'stamp-card';
        card.onclick = () => replayCard(s.id);
        card.innerHTML = `
          <div class="img-wrap">
            <img id="stamp-img-${s.id}" src="${src}" alt="${s.title}">
          </div>
          <div class="meta">
            <div class="filename">${s.id}.${ext} : ${s.title}</div>
            <div class="cam-tag">📷 ${s.cam}</div>
            <p style="font-size: 12px; color: #666; margin-top: 4px;">${s.desc}</p>
            <span class="tag">透過RGBA・チカチカ完全ゼロ</span>
          </div>
        `;
        container.appendChild(card);
      });

      // main & tab にもキャッシュバスター
      document.getElementById('img-main').src = 'main.png?v=' + baseTime;
      document.getElementById('img-tab').src = 'tab.png?v=' + baseTime;
    }

    function setMode(mode) {
      currentMode = mode;
      document.getElementById('btn-loop').classList.toggle('active', mode === 'loop');
      document.getElementById('btn-apng').classList.toggle('active', mode === 'apng');
      renderCards();
    }

    // クリックで先頭から再再生
    function replayCard(id) {
      const img = document.getElementById(`stamp-img-${id}`);
      if (!img) return;
      const ext = currentMode === 'loop' ? 'gif' : 'png';
      img.src = `${id}.${ext}?v=${Date.now()}`;
    }

    // APNGモード時、4秒ごとに止まらないよう自動で先頭からループリプレイ
    setInterval(() => {
      if (currentMode === 'apng') {
        STAMPS.forEach((s) => replayCard(s.id));
      }
    }, 4200);

    function setBg(bg, ev) {
      document.querySelectorAll('.btn-group button').forEach(b => {
        if (b.innerText.includes('背景') || b.innerText.includes('モード') || b.innerText.includes('水色') || b.innerText.includes('市松')) {
          b.classList.remove('active');
        }
      });
      if (ev) ev.target.classList.add('active');
      if (bg === 'checker') {
        document.body.style.background = 'repeating-conic-gradient(#CCC 0% 25%, #FFF 0% 50%) 50% / 20px 20px';
      } else {
        document.body.style.background = bg;
      }
    }

    renderCards();
  </script>
</body>
</html>
