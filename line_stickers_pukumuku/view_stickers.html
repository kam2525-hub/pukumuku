<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>パン工房プクムク 純利益 公式LINEアニメーションスタンプ プレビュー</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
    body {
      background: #7AC0D6; /* LINEトーク画面の定番背景色 */
      color: #333;
      padding: 30px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    header {
      background: #FFFFFF;
      padding: 20px 30px;
      border-radius: 16px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.1);
      text-align: center;
      max-width: 800px;
      width: 100%;
      margin-bottom: 24px;
    }
    h1 { font-size: 22px; color: #2E1505; margin-bottom: 8px; }
    p.desc { font-size: 14px; color: #666; line-height: 1.6; }
    .bg-toggle {
      margin-top: 14px;
      display: flex;
      justify-content: center;
      gap: 10px;
    }
    .btn {
      padding: 6px 16px;
      border: 1px solid #CCC;
      border-radius: 20px;
      cursor: pointer;
      background: #FFF;
      font-size: 13px;
      font-weight: bold;
    }
    .btn.active {
      background: #06C755;
      color: #FFF;
      border-color: #06C755;
    }
    .container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 24px;
      max-width: 1100px;
      width: 100%;
    }
    .stamp-card {
      background: rgba(255, 255, 255, 0.92);
      border-radius: 16px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      box-shadow: 0 6px 18px rgba(0,0,0,0.08);
      backdrop-filter: blur(10px);
    }
    .img-wrap {
      width: 320px;
      height: 270px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }
    .img-wrap img {
      max-width: 100%;
      max-height: 100%;
      display: block;
    }
    .meta {
      margin-top: 12px;
      text-align: center;
      width: 100%;
    }
    .filename {
      font-weight: 900;
      font-size: 16px;
      color: #333;
    }
    .tag {
      display: inline-block;
      margin-top: 4px;
      padding: 2px 10px;
      background: #06C755;
      color: white;
      font-size: 11px;
      font-weight: bold;
      border-radius: 10px;
    }
    .main-tab-wrap {
      display: flex;
      gap: 20px;
      justify-content: center;
      margin-top: 16px;
      background: #FFF;
      padding: 20px;
      border-radius: 16px;
      max-width: 800px;
      width: 100%;
      box-shadow: 0 4px 16px rgba(0,0,0,0.1);
      margin-bottom: 24px;
    }
    .sub-item {
      display: flex;
      flex-direction: column;
      align-items: center;
    }
  </style>
</head>
<body>
  <header>
    <h1>🥖 パン工房プクムク 純利益 公式LINEアニメーションスタンプ</h1>
    <p class="desc">
      LINE Creators Market 規定に完全準拠した APNG 形式のアニメーションスタンプです。<br>
      透過背景・解像度320×270px・300KB以下・2秒ループ×2回（計4秒）を達成しています。
    </p>
    <div class="bg-toggle">
      <button class="btn active" onclick="setBg('#7AC0D6')">LINEトーク水色</button>
      <button class="btn" onclick="setBg('#FFFFFF')">白背景</button>
      <button class="btn" onclick="setBg('#1E1E1E')">ダークモード</button>
      <button class="btn" onclick="setBg('checker')">市松透過</button>
    </div>
  </header>

  <div class="main-tab-wrap">
    <div class="sub-item">
      <span style="font-weight: bold; font-size: 13px; margin-bottom: 6px;">メイン画像 (main.png: 240×240)</span>
      <img src="main.png" alt="main" width="120" height="120" style="border: 1px solid #DDD; border-radius: 8px;">
    </div>
    <div class="sub-item">
      <span style="font-weight: bold; font-size: 13px; margin-bottom: 6px;">タブ画像 (tab.png: 96×74)</span>
      <img src="tab.png" alt="tab" width="96" height="74" style="border: 1px solid #DDD; border-radius: 8px; margin-top: 23px;">
    </div>
  </div>

  <div class="container" id="stamp-container"></div>

  <script>
    const STAMPS = [
      { file: "01.png", title: "こんにちは！", desc: "手を振りながら太陽がくるくる" },
      { file: "02.png", title: "ありがとう！", desc: "お辞儀（ぺこり）＋ハート浮遊" },
      { file: "03.png", title: "OK！", desc: "大きく頷いて親指グッ＋キラキラ" },
      { file: "04.png", title: "NO", desc: "首を横に振る＋汗たらりマーク" },
      { file: "05.png", title: "急ぎます！", desc: "小走りでパン配達＋土煙モクモク" },
      { file: "06.png", title: "いただきます", desc: "バゲットを抱えて目を輝かせる" },
      { file: "07.png", title: "お疲れさまです", desc: "パンを差し入れ＋湯気ほっこり" },
      { file: "08.png", title: "やったー！", desc: "歓喜のジャンプ＋紙吹雪パーン" },
    ];

    const container = document.getElementById('stamp-container');
    STAMPS.forEach((s) => {
      const card = document.createElement('div');
      card.className = 'stamp-card';
      card.innerHTML = `
        <div class="img-wrap">
          <img src="${s.file}" alt="${s.title}">
        </div>
        <div class="meta">
          <div class="filename">${s.file} : ${s.title}</div>
          <p style="font-size: 12px; color: #666; margin-top: 2px;">${s.desc}</p>
          <span class="tag">APNG 320×270px (透過)</span>
        </div>
      `;
      container.appendChild(card);
    });

    function setBg(bg) {
      document.querySelectorAll('.btn').forEach(b => b.classList.remove('active'));
      event.target.classList.add('active');
      if (bg === 'checker') {
        document.body.style.background = 'repeating-conic-gradient(#CCC 0% 25%, #FFF 0% 50%) 50% / 20px 20px';
      } else {
        document.body.style.background = bg;
      }
    }
  </script>
</body>
</html>
